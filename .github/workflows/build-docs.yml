name: Build docs

permissions:
  contents: read

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'docs/packages/**'
      - 'mkdocs.yml'
      - '.github/**'
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - 'docs/packages/**'
      - 'mkdocs.yml'
      - '.github/**'
  schedule:
    - cron: "*/30 * * * *"
    
  workflow_dispatch:
     inputs:
      commit_message:
        description: 'Git commit message if changes are found.'
        default: 'Generated by build-docs workflow.'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout docs
        uses: actions/checkout@v6
        with:
            path: docs

      # Blow away docs/pacakges and mkdocs.yml, run build script and commit.
      - name: prepare for running "bin/the_final_markdown.sh"
        run: |
            cd $GITHUB_WORKSPACE/docs
            rm -rf docs/packages mkdocs.yml
            pip install -r docs/requirements.txt
            bin/the_final_markdown.sh | tee $GITHUB_WORKSPACE/build_log.txt
            date >> $GITHUB_WORKSPACE/build_log.txt
            echo "Work area:"
            ls -alrt

      - name: upload work area
        uses: actions/upload-artifact@v7
        with:
          name: docs-worktree
          path: docs

      - name: upload build log
        uses: actions/upload-artifact@v7
        with:
          name: docs build log
          path: ${{ github.workspace }}/build_log.txt

  push:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: docs-worktree
        path: docs-tmp
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        path: docs-output
    - name: Sync changes
      run: |
        pwd
        ls -lrt
        echo "Docs tmp:"
        ls -alrt docs-tmp/
        echo "Docs output:"
        ls -alrt docs-output/
        rsync -a docs-tmp/ docs-output/
        cd docs-output
        git status
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        COMMIT_MSG="\"${{ github.event.inputs.commit_message }}\""
        COMMIT_MSG=${COMMIT_MSG:="\"Generated by build-docs workflow.\""}
        git diff-index --quiet HEAD && echo "No changes found in generated docs, exit now without commit." >> $GITHUB_WORKSPACE/build_log.txt || (git commit -m "$COMMIT_MSG" && git push)

